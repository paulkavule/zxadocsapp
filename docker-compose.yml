# UI behind nginx. The API is a separate stack in the DocsApi repo.
#
#   export GH_PACKAGES_TOKEN=<PAT with read:packages>
#   docker compose up --build
#
# Set Api__BaseUrl=http://host.docker.internal:8080/ in zxadocsui/.env. That name
# does not resolve outside Docker, so a standalone run needs the localhost value.

services:
  ui:
    build:
      context: .
      dockerfile: zxadocsui/Dockerfile
      secrets:
        - ghtoken
    env_file:
      - zxadocsui/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - ui
    ports:
      - "8086:80"
      # - "8443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped

secrets:
  ghtoken:
    environment: GH_PACKAGES_TOKEN
