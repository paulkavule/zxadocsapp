# UI behind nginx. The API is a separate stack in the DocsApi repo — point
# Api__BaseUrl at it (see docker.env.example).
#
#   export GH_PACKAGES_TOKEN=<PAT with read:packages>
#   cp docker.env.example docker.env
#   docker compose up --build

services:
  ui:
    build:
      context: .
      dockerfile: zxadocsui/Dockerfile
      secrets:
        - ghtoken
    # docker.env overrides the app's .env; later files win.
    env_file:
      - zxadocsui/.env
      - docker.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - ui
    ports:
      - "8086:80"
      # - "8443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped

secrets:
  ghtoken:
    environment: GH_PACKAGES_TOKEN
