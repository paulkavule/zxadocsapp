# Reverse proxy for the Blazor Server UI. TLS terminates here; the app speaks
# plain HTTP and its port is never published. For HTTPS, add certs to
# nginx/certs/ (gitignored) and uncomment the second server block.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ui {
    server ui:8080;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 12m;

    location / {
        proxy_pass http://ui;

        # Without these the SignalR circuit never upgrades and the page renders
        # once, then silently stops responding — no error anywhere.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # An idle circuit sends nothing while an author reads; nginx's 60s
        # default would close it and show "Attempting to reconnect".
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_buffering off;
    }
}

